global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "namespace", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default"
    # Заглушка: алерты видны в UI Alertmanager и Grafana.
    # Для реальных уведомлений добавь, например, webhook:
    # webhook_configs:
    #   - url: http://your-webhook:5000/alerts
    # или email_configs / slack_configs / telegram_configs.

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ["alertname", "instance"]
