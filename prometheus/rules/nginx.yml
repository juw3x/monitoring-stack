groups:
  - name: nginx.rules
    rules:
      - alert: NginxHigh5xxRate
        expr: |
          sum(rate(nginx_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(nginx_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Nginx 5xx error rate above 5%"
          description: "More than 5% of requests return 5xx over the last 5 minutes."

      - alert: NginxHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(nginx_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Nginx p95 latency above 1s"

      - alert: NginxExporterDown
        expr: up{job="nginx"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "nginx-exporter or nginx stub_status is unreachable"
