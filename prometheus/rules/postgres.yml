groups:
  - name: postgres.rules
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter cannot reach the database"

      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "postgres-exporter is down"

      - alert: PostgresHighConnections
        expr: |
          sum(pg_stat_activity_count) by (datname)
          / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected on {{ $labels.datname }}"

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replication lag above 30s"
